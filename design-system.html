<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Asimov Academy Design System</title>
    <link rel="icon" href="assets/overview/favicon.png" type="image/png" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="assets/themes.js"></script>
    <style>
      :root { color-scheme: dark; --ui-accent: #14b8a6; --ui-accent-dark: #0d9488; --ui-accent-light: #2dd4bf; --ui-accent-glow: #5eead4; --ui-accent-rgb-space: 20 184 166; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #050505; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050505; }
      .catalog-nav {
        position: fixed; inset: 0 0 auto; z-index: 900; height: 64px;
        display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 24px;
        padding: 0 24px 0 40px; border-bottom: 1px solid rgb(255 255 255 / .08);
        background: rgb(5 5 8 / .9); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      }
      .catalog-logo { display: flex; align-items: center; width: 82px; height: 28px; }
      .catalog-logo img { display: block; width: 82px; height: auto; }
      .catalog-links { display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .catalog-links a {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 9px 15px; border: 1px solid transparent; border-radius: 8px;
        color: #969aa0; background: transparent; font-size: 12px; font-weight: 500;
        line-height: 1; text-decoration: none; transition: background .2s, border-color .2s, box-shadow .2s, color .2s;
      }
      .catalog-links a:hover, .catalog-links a:focus-visible { color: var(--ui-accent-light); outline: none; }
      .catalog-links a[aria-current="page"] {
        border-color: color-mix(in srgb, var(--ui-accent) 26%, transparent);
        color: var(--ui-accent-light); background: color-mix(in srgb, var(--ui-accent) 9%, transparent);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / .04);
      }
      .theme-control { justify-self: end; display: flex; align-items: center; gap: 9px; min-width: 0; }
      .theme-control label { color: #b4b4b4; font-size: 11px; font-weight: 500; }
      .theme-select-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .theme-swatch { width: 12px; height: 12px; flex: none; border-radius: 4px; background: var(--ui-accent); box-shadow: 0 0 14px color-mix(in srgb, var(--ui-accent) 25%, transparent); }
      .theme-control select { width: 180px; min-width: 0; padding: 8px 28px 8px 10px; border: 1px solid rgb(255 255 255 / .13); border-radius: 8px; color: #e5e7eb; background: #0b0b0e; font-size: 11px; outline: none; }
      .theme-control select:focus-visible { border-color: var(--ui-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ui-accent) 14%, transparent); }
      .mode-switch { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid rgb(255 255 255 / .13); border-radius: 9px; background: #0b0b0e; }
      .mode-switch button { padding: 6px 10px; border: 0; border-radius: 6px; color: #969aa0; background: transparent; font: 500 11px/1 Inter, ui-sans-serif, system-ui, sans-serif; cursor: pointer; transition: background .2s, color .2s; }
      .mode-switch button:hover { color: #e5e7eb; }
      .mode-switch button:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 1px; }
      .mode-switch button[aria-pressed="true"] { color: #e5e7eb; background: rgb(255 255 255 / .1); }
      .catalog-view { position: fixed; inset: 64px 0 0; }
      /* Modo claro: a própria navbar acompanha o conteúdo. */
      :root[data-modo="claro"] { color-scheme: light; background: #f4f4f5; }
      [data-modo="claro"] body, [data-modo="claro"] .catalog-view iframe { background: #f4f4f5; }
      [data-modo="claro"] .catalog-nav { border-bottom-color: #e4e4e7; background: rgb(255 255 255 / .85); }
      [data-modo="claro"] .catalog-logo img { filter: brightness(0); }
      [data-modo="claro"] .catalog-links a { color: #52525b; }
      [data-modo="claro"] .catalog-links a:hover, [data-modo="claro"] .catalog-links a:focus-visible,
      [data-modo="claro"] .catalog-links a[aria-current="page"] { color: color-mix(in srgb, var(--ui-accent-dark) 78%, #000); }
      [data-modo="claro"] .catalog-links a[aria-current="page"] { background: color-mix(in srgb, var(--ui-accent) 9%, #fff); box-shadow: none; }
      [data-modo="claro"] .theme-control label { color: #52525b; }
      [data-modo="claro"] .theme-control select { border-color: #d4d4d8; color: #09090b; background: #fff; }
      [data-modo="claro"] .mode-switch { border-color: #d4d4d8; background: #fff; }
      [data-modo="claro"] .mode-switch button { color: #71717a; }
      [data-modo="claro"] .mode-switch button:hover { color: #09090b; }
      [data-modo="claro"] .mode-switch button[aria-pressed="true"] { color: #09090b; background: #f4f4f5; box-shadow: inset 0 0 0 1px #e4e4e7; }
      .catalog-view iframe { display: block; width: 100%; height: 100%; border: 0; background: #050505; }
      @media (max-width: 1200px) {
        .catalog-nav { grid-template-columns: auto minmax(0,1fr) auto; }
        .catalog-links { justify-self: center; }
      }
      @media (max-width: 1024px) {
        .catalog-nav { gap: 14px; padding-left: 24px; }
        .theme-control label, .theme-swatch { display: none; }
        .theme-control select { width: 140px; }
      }
      /* No celular os controles de modo e cor descem para uma segunda linha. */
      @media (max-width: 640px) {
        .catalog-nav {
          height: 104px; padding: 0 16px; gap: 0 12px;
          grid-template-columns: auto minmax(0,1fr); grid-template-rows: 56px 48px;
        }
        .catalog-logo, .catalog-logo img { width: 72px; }
        .catalog-links { justify-self: end; gap: 2px; }
        .catalog-links a { padding: 7px 8px; font-size: 11px; }
        .theme-control { grid-column: 1 / -1; justify-self: stretch; justify-content: space-between; align-self: start; }
        .theme-control label { display: block; margin-left: auto; }
        .theme-swatch { display: block; }
        .theme-select-wrap { flex: 0 1 auto; }
        .theme-control select { width: min(180px, 100%); }
        .catalog-view { inset-block-start: 104px; }
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="catalog-nav" aria-label="Design system">
        <a class="catalog-logo" href="#overview" aria-label="Asimov Academy Design System"><img src="assets/asimov-logo.svg" alt="" /></a>
        <ul class="catalog-links">
          <li><a href="#overview">Overview</a></li>
          <li><a href="#components">Components</a></li>
          <li><a href="emails/index.html">Emails</a></li>
        </ul>
        <div class="theme-control">
          <div class="mode-switch" role="group" aria-label="Modo">
            <button type="button" data-modo="escuro" aria-pressed="true">Escuro</button>
            <button type="button" data-modo="claro" aria-pressed="false">Claro</button>
          </div>
          <label for="catalog-theme">Cores</label>
          <div class="theme-select-wrap">
            <span class="theme-swatch" aria-hidden="true"></span>
            <select id="catalog-theme" aria-label="Cor da página">
              <option value="teal_asimov">Teal</option>
              <option value="cyan_asimov">Ciano</option>
              <option value="formacao_engenheiro_ia">Engenheiro de IA</option>
              <option value="formacao_analista_dados">Laranja</option>
              <option value="formacao_ai_designer">Azul</option>
              <option value="trilha_automacoes_n8n">Automações n8n</option>
              <option value="trilha_hermes_agent">Hermes Agent</option>
              <option value="trilha_openclaw">OpenClaw</option>
              <option value="trilha_python_web">Vermelho</option>
              <option value="trilha_engenharia_dados">Verde</option>
              <option value="trilha_aplicacoes_inteligentes_ia">Aplicações IA</option>
              <option value="trilha_aprendendo_python">Aprendendo Python</option>
              <option value="trilha_data_science_ml">Terracota</option>
              <option value="trilha_dashboards_interativos">Dashboards</option>
              <option value="trilha_visao_computacional">Roxo</option>
              <option value="trilha_python_office">Python Office</option>
              <option value="trilha_vibe_coding">Vibe Coding</option>
            </select>
          </div>
        </div>
      </nav>
    </header>
    <main class="catalog-view">
      <iframe id="catalog-frame" src="assets/overview/index.html" title="Asimov Academy Design System — Overview"></iframe>
    </main>
    <script>
      (() => {
        const frame = document.querySelector("#catalog-frame");
        const links = [...document.querySelectorAll(".catalog-links a")];
        const themeSelect = document.querySelector("#catalog-theme");
        const modeButtons = [...document.querySelectorAll(".mode-switch button")];
        // O modo vem de ?modo=claro (link compartilhável) ou da última escolha salva.
        let modo = new URLSearchParams(location.search).get("modo");
        if (modo !== "claro" && modo !== "escuro") {
          try { modo = localStorage.getItem("asimov-design-system-modo"); } catch {}
        }
        if (modo !== "claro") modo = "escuro";
        const frameSrc = (src) => (modo === "claro" ? `${src}?modo=claro` : src);
        const routes = {
          overview: { src: "assets/overview/index.html", title: "Asimov Academy Design System — Overview" },
          components: { src: "assets/components/index.html", title: "Asimov Academy Design System — Components" },
        };
        const render = ({ replace = false } = {}) => {
          const route = location.hash.slice(1) in routes ? location.hash.slice(1) : "overview";
          if (location.hash !== `#${route}`) history[replace ? "replaceState" : "pushState"](null, "", `#${route}`);
          const next = routes[route];
          if (!frame.src.endsWith(frameSrc(next.src))) frame.src = frameSrc(next.src);
          frame.title = next.title;
          links.forEach((link) => {
            if (link.hash === `#${route}`) link.setAttribute("aria-current", "page");
            else link.removeAttribute("aria-current");
          });
          document.title = next.title;
        };
        const applyTheme = (key) => {
          const theme = window.AsimovThemes?.[key];
          if (!theme) return;
          Object.entries(theme).forEach(([token, value]) => document.documentElement.style.setProperty(`--ui-${token}`, value));
          const hex = theme.accent.slice(1);
          const rgb = [0, 2, 4].map((index) => parseInt(hex.slice(index, index + 2), 16)).join(" ");
          document.documentElement.style.setProperty("--ui-accent-rgb-space", rgb);
          frame.contentWindow?.postMessage({ type: "asimov-theme", key, theme, rgb }, "*");
          try { localStorage.setItem("asimov-design-system-theme", key); } catch {}
        };
        const applyMode = () => {
          document.documentElement.dataset.modo = modo;
          modeButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.modo === modo)));
        };
        modeButtons.forEach((button) => button.addEventListener("click", () => {
          if (button.dataset.modo === modo) return;
          modo = button.dataset.modo;
          try { localStorage.setItem("asimov-design-system-modo", modo); } catch {}
          const url = new URL(location.href);
          if (modo === "claro") url.searchParams.set("modo", "claro");
          else url.searchParams.delete("modo");
          try { history.replaceState(null, "", url); } catch {}
          applyMode();
          render({ replace: true });
        }));
        applyMode();
        document.addEventListener("click", (event) => {
          const link = event.target.closest('a[href^="#"]');
          if (!link || !(link.hash.slice(1) in routes)) return;
          event.preventDefault();
          history.pushState(null, "", link.hash);
          render();
        });
        window.addEventListener("popstate", () => render({ replace: true }));
        frame.addEventListener("load", () => applyTheme(themeSelect.value));
        themeSelect.addEventListener("change", () => applyTheme(themeSelect.value));
        try {
          const saved = localStorage.getItem("asimov-design-system-theme");
          if (saved && window.AsimovThemes?.[saved] && [...themeSelect.options].some((option) => option.value === saved)) themeSelect.value = saved;
        } catch {}
        render({ replace: true });
        applyTheme(themeSelect.value);
      })();
    </script>
  </body>
</html>
